name: D01 strict YAML validation
'on':
  push:
    branches:
    - bfp-isolated-d01-five
permissions: {}
jobs:
  buggy:
    runs-on: ubuntu-latest
    steps:
    - name: Install YAML parser
      run: python -m pip install PyYAML==6.0.2
      id: parser
    - name: b17e046e4878 kivy/python-for-android
      if: ${{ !cancelled() && steps.parser.outcome == 'success' }}
      env:
        SOURCE_YAML: 
      run: "python - <<'PY'\nimport base64\nimport os\nimport yaml\n\ndef check(node):\n\
        \    if isinstance(node, yaml.MappingNode):\n        seen = set()\n      \
        \  for key, value in node.value:\n            if isinstance(key, yaml.ScalarNode):\n\
        \                identity = (key.tag, key.value)\n                if identity\
        \ in seen:\n                    raise ValueError(f\"line {key.start_mark.line\
        \ + 1}: duplicate mapping key {key.value!r}\")\n                seen.add(identity)\n\
        \            check(value)\n    elif isinstance(node, yaml.SequenceNode):\n\
        \        for child in node.value:\n            check(child)\n\ntry:\n    check(yaml.compose(base64.b64decode(os.environ[\"\
        SOURCE_YAML\"]).decode(\"utf-8-sig\")))\nexcept (ValueError, yaml.YAMLError)\
        \ as error:\n    print(error)\n    raise SystemExit(1)\nprint(\"Strict YAML\
        \ validation passed\")\nPY\n"
